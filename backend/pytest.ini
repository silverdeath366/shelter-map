[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = 
    -v
    --strict-markers
    --tb=short
filterwarnings =
    ignore::DeprecationWarning
markers =
    unit: Unit tests that run with SQLite (no PostGIS required)
    integration: Integration tests requiring PostgreSQL/PostGIS
    slow: Slow running tests

# Coverage settings - use with: pytest --cov=app --cov-report=html --cov-report=term-missing --cov-report=xml --cov-fail-under=60
# Or run: ./run-tests.sh coverage (which starts the database container first)