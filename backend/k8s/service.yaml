---
# GeoJSON Ingestion Service (ClusterIP)
apiVersion: v1
kind: Service
metadata:
  name: geojson-ingestion-service
  namespace: geojson-ingestion
  labels:
    app: geojson-ingestion
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8091
    protocol: TCP
    name: http
  selector:
    app: geojson-ingestion
  sessionAffinity: None

---
# GeoJSON Ingestion Ingress (ALB)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: geojson-ingestion-ingress
  namespace: geojson-ingestion
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "30"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
    alb.ingress.kubernetes.io/success-codes: "200"
    alb.ingress.kubernetes.io/load-balancer-name: ${CLUSTER_NAME}-geojson-alb
    alb.ingress.kubernetes.io/tags: Environment=${ENVIRONMENT},Project=${PROJECT_NAME},Service=geojson-ingestion
spec:
  ingressClassName: alb
  rules:
  - host: geojson.example.com  # Replace with your domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: geojson-ingestion-service
            port:
              number: 80
