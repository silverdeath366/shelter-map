---
# AWS IAM Service Account for EKS Pods
# Uses IRSA (IAM Roles for Service Accounts) for secure AWS access
# The service account uses the CSI Secrets Store driver service account for secrets access
# If additional AWS permissions are needed, create a dedicated IRSA role

apiVersion: v1
kind: ServiceAccount
metadata:
  name: geojson-ingestion-sa
  namespace: geojson-ingestion
  annotations:
    # Use the existing CSI Secrets Store driver role for secrets access
    # If you need additional AWS permissions, create a dedicated role and update this
    eks.amazonaws.com/role-arn: arn:aws:iam::258395061463:role/platform-prod-irsa-csi-secrets-role
  labels:
    app: geojson-ingestion
    component: service-account

