# Test-specific docker-compose for running integration tests with PostGIS
services:
  test-db:
    image: postgis/postgis:15-3.3
    container_name: geojson-test-db
    environment:
      - POSTGRES_DB=geojson_test
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5433:5432"  # Different port to avoid conflicts with dev database
    volumes:
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d geojson_test"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    tmpfs:
      - /var/lib/postgresql/data  # Use tmpfs for faster tests
