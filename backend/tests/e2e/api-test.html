<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoJSON Ingestion API - Test Interface</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .section h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 20px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
            font-size: 14px;
        }

        input[type="text"],
        input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="file"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            flex: 1;
            min-width: 120px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
            transform: translateY(-2px);
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-success:hover {
            background: #218838;
            transform: translateY(-2px);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        #result {
            margin-top: 20px;
            padding: 20px;
            background: #1e1e1e;
            border-radius: 8px;
            color: #d4d4d4;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.6;
            max-height: 400px;
            overflow-y: auto;
            display: none;
        }

        #result.show {
            display: block;
        }

        #result.success {
            border-left: 4px solid #28a745;
        }

        #result.error {
            border-left: 4px solid #dc3545;
        }

        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .status-online {
            background: #28a745;
            box-shadow: 0 0 10px rgba(40, 167, 69, 0.5);
        }

        .status-offline {
            background: #dc3545;
            box-shadow: 0 0 10px rgba(220, 53, 69, 0.5);
        }

        .status-checking {
            background: #ffc107;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .info-box {
            background: #e7f3ff;
            border-left: 4px solid #2196F3;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #0d47a1;
        }

        .config-section {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
        }

        .config-section h3 {
            font-size: 16px;
            margin-bottom: 10px;
            color: #856404;
        }

        .config-section input {
            margin-bottom: 10px;
        }

        pre {
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .stat-card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
            text-align: center;
        }

        .stat-card .value {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }

        .stat-card .label {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌍 GeoJSON Ingestion API</h1>
            <p>Test Interface for DevOps & API Testing</p>
            <div style="margin-top: 15px;">
                <span class="status-indicator status-checking" id="statusIndicator"></span>
                <span id="statusText">Checking connection...</span>
            </div>
        </div>

        <div class="content">
            <div class="config-section">
                <h3>⚙️ Configuration</h3>
                <div class="input-group">
                    <label for="apiUrl">API URL:</label>
                    <input type="text" id="apiUrl" value="http://localhost:3000" placeholder="http://localhost:3000">
                </div>
                <div class="input-group">
                    <label for="apiKey">API Key:</label>
                    <input type="text" id="apiKey" value="a3316b66dad857b1787dc63dfef829e7c031a88de2f76c58a6b36b7cd3353c9d" placeholder="Your API key">
                </div>
            </div>

            <!-- Health Check Section -->
            <div class="section">
                <h2>💚 Health Check</h2>
                <p style="margin-bottom: 15px; color: #666; font-size: 14px;">
                    Check if the service is running and healthy
                </p>
                <div class="button-group">
                    <button class="btn-primary" onclick="testHealth()">
                        Test /healthz
                    </button>
                    <button class="btn-secondary" onclick="checkConnection()">
                        Check Connection
                    </button>
                </div>
                <div id="healthStats" class="stats-grid" style="display: none;"></div>
            </div>

            <!-- File Upload Section -->
            <div class="section">
                <h2>📤 File Upload</h2>
                <p style="margin-bottom: 15px; color: #666; font-size: 14px;">
                    Upload a GeoJSON file to test the ingestion endpoint
                </p>
                <div class="input-group">
                    <label for="fileInput">Select GeoJSON File:</label>
                    <input type="file" id="fileInput" accept=".geojson,application/geo+json,application/json">
                </div>
                <div class="button-group">
                    <button class="btn-success" onclick="testUpload()" id="uploadBtn">
                        Upload File
                    </button>
                </div>
            </div>

            <!-- Results Section -->
            <div id="result"></div>
        </div>
    </div>

    <script>
        const API_URL_KEY = 'geojson_api_url';
        const API_KEY_KEY = 'geojson_api_key';

        // Load saved config
        window.addEventListener('DOMContentLoaded', () => {
            const savedUrl = localStorage.getItem(API_URL_KEY);
            const savedKey = localStorage.getItem(API_KEY_KEY);
            
            if (savedUrl) document.getElementById('apiUrl').value = savedUrl;
            if (savedKey) document.getElementById('apiKey').value = savedKey;
            
            // Auto-check connection on load
            checkConnection();
        });

        // Save config on change
        document.getElementById('apiUrl').addEventListener('change', (e) => {
            localStorage.setItem(API_URL_KEY, e.target.value);
        });

        document.getElementById('apiKey').addEventListener('change', (e) => {
            localStorage.setItem(API_KEY_KEY, e.target.value);
        });

        function getApiUrl() {
            return document.getElementById('apiUrl').value.trim() || 'http://localhost:3000';
        }

        function getApiKey() {
            return document.getElementById('apiKey').value.trim();
        }

        function showResult(data, isError = false) {
            const resultDiv = document.getElementById('result');
            resultDiv.className = `show ${isError ? 'error' : 'success'}`;
            resultDiv.innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
            resultDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function setLoading(buttonId, isLoading) {
            const btn = document.getElementById(buttonId);
            if (btn) {
                btn.disabled = isLoading;
                if (isLoading) {
                    btn.innerHTML = btn.textContent + '<span class="loading"></span>';
                } else {
                    btn.innerHTML = btn.textContent.replace('<span class="loading"></span>', '');
                }
            }
        }

        function updateStatus(online) {
            const indicator = document.getElementById('statusIndicator');
            const text = document.getElementById('statusText');
            
            if (online) {
                indicator.className = 'status-indicator status-online';
                text.textContent = 'Service Online';
            } else {
                indicator.className = 'status-indicator status-offline';
                text.textContent = 'Service Offline';
            }
        }

        async function checkConnection() {
            const indicator = document.getElementById('statusIndicator');
            const text = document.getElementById('statusText');
            
            indicator.className = 'status-indicator status-checking';
            text.textContent = 'Checking...';
            
            try {
                const response = await fetch(`${getApiUrl()}/healthz`, {
                    method: 'GET',
                    signal: AbortSignal.timeout(5000)
                });
                
                if (response.ok) {
                    const data = await response.json();
                    updateStatus(true);
                    showHealthStats(data);
                } else {
                    updateStatus(false);
                }
            } catch (error) {
                updateStatus(false);
                console.error('Connection check failed:', error);
            }
        }

        function showHealthStats(data) {
            const statsDiv = document.getElementById('healthStats');
            statsDiv.style.display = 'grid';
            statsDiv.innerHTML = `
                <div class="stat-card">
                    <div class="value">${data.status || 'N/A'}</div>
                    <div class="label">Status</div>
                </div>
                <div class="stat-card">
                    <div class="value">${data.feature_count || 0}</div>
                    <div class="label">Features</div>
                </div>
                <div class="stat-card">
                    <div class="value">${data.database_connected ? '✓' : '✗'}</div>
                    <div class="label">Database</div>
                </div>
                <div class="stat-card">
                    <div class="value">${data.service || 'N/A'}</div>
                    <div class="label">Service</div>
                </div>
            `;
        }

        async function testHealth() {
            try {
                const response = await fetch(`${getApiUrl()}/healthz`);
                const data = await response.json();
                showResult(data, false);
                showHealthStats(data);
                updateStatus(true);
            } catch (error) {
                showResult({ error: error.message, details: 'Make sure port-forward is running' }, true);
                updateStatus(false);
            }
        }

        async function testUpload() {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            
            if (!file) {
                alert('Please select a GeoJSON file first');
                return;
            }

            setLoading('uploadBtn', true);
            
            try {
                const formData = new FormData();
                formData.append('file', file);
                
                const apiKey = getApiKey();
                const headers = {};
                if (apiKey) {
                    headers['X-API-Key'] = apiKey;
                }
                
                const response = await fetch(`${getApiUrl()}/ingest`, {
                    method: 'POST',
                    headers: headers,
                    body: formData
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    showResult(data, false);
                    // Refresh health stats after upload
                    setTimeout(checkConnection, 1000);
                } else {
                    showResult(data, true);
                }
            } catch (error) {
                showResult({ 
                    error: error.message, 
                    details: 'Check your API URL and ensure port-forward is running',
                    hint: 'kubectl port-forward svc/geojson-ingestion-service 3000:80'
                }, true);
            } finally {
                setLoading('uploadBtn', false);
            }
        }
    </script>
</body>
</html>
